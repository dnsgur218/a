<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brawl Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

<!-- ======= MAIN ======= -->
<div id="s-main" class="screen active">
  <div class="main-wrap">
    <div class="main-logo">
      <div class="logo-icon">⚔️</div>
      <h1>BRAWL<br>SIMULATOR</h1>
      <p>FFA 자동 전투</p>
    </div>
    <div class="main-btns">
      <button class="btn primary" onclick="goCreate()">캐릭터 생성 / 편집</button>
      <button class="btn danger"  onclick="goLobby()">전투 시작</button>
      <button class="btn ghost"   onclick="goRecords()">전적 확인</button>
    </div>
  </div>
</div>

<!-- ======= CHARACTER CREATE ======= -->
<div id="s-create" class="screen">
  <div class="page-wrap">
    <div class="page-head">
      <button class="btn-back" onclick="goLobby()">← 뒤로</button>
      <h2>캐릭터 생성</h2>
    </div>

    <div class="name-row">
      <label>이름</label>
      <input id="char-name" type="text" maxlength="10" placeholder="이름 입력" value="Player">
    </div>

    <!-- STEP 1 -->
    <div class="card">
      <div class="card-title">
        STEP 1 &nbsp; 스탯 분배
        <span id="stat-pts" class="badge"></span>
      </div>
      <div id="stat-grid"></div>
      <div id="stat-summary" class="summary-bar"></div>
    </div>

    <!-- STEP 2 -->
    <div class="card">
      <div class="card-title">
        STEP 2 &nbsp; 스킬 설정
        <span id="skill-pts" class="badge"></span>
      </div>
      <div id="skill-slots"></div>
    </div>

    <!-- STEP 3 -->
    <div class="card">
      <div class="card-title">STEP 3 &nbsp; 스킬 우선도</div>
      <div id="priority-list"></div>
    </div>

    <div id="create-msg" class="err-msg"></div>
    <button class="btn primary full" onclick="CharCreator.save()">완성 →</button>
  </div>
</div>

<!-- ======= LOBBY ======= -->
<div id="s-lobby" class="screen">
  <div class="page-wrap">
    <div class="page-head">
      <button class="btn-back" onclick="goMain()">← 뒤로</button>
      <h2>전투 로비 &nbsp;<span id="lobby-count" class="dim">0/8</span></h2>
    </div>
    <div id="lobby-list"></div>
    <div class="lobby-actions">
      <button class="btn ghost" onclick="goCreate()">+ 내 캐릭터</button>
      <button class="btn ghost" onclick="Lobby.addAI()">+ AI 추가</button>
      <button class="btn danger" id="btn-start" onclick="Lobby.start()">전투 시작 !</button>
    </div>
    <div id="lobby-msg" class="err-msg"></div>
  </div>
</div>

<!-- ======= BATTLE ======= -->
<div id="s-battle" class="screen">
  <div class="battle-wrap">
    <div class="battle-topbar">
      <span id="battle-turn-lbl" class="turn-lbl">턴 0</span>
      <span id="battle-gas-lbl" class="gas-lbl"></span>
      <button class="btn ghost sm" onclick="goLobby()">중단</button>
    </div>
    <div class="battle-main">
      <div class="arena-wrap">
        <canvas id="arena" width="460" height="420"></canvas>
      </div>
      <div class="side-panel">
        <div id="hp-panel" class="hp-panel"></div>
      </div>
    </div>
    <div id="battle-log" class="battle-log"></div>
    <div class="battle-controls">
      <button class="btn primary" onclick="BattleEngine.doTurn()" id="btn-next">▶ 다음 턴</button>
      <button class="btn ghost"   onclick="BattleRenderer.toggleAuto()" id="btn-auto">⏩ 자동</button>
    </div>
  </div>
</div>

<!-- ======= RESULTS ======= -->
<div id="s-results" class="screen">
  <div class="page-wrap">
    <h2 class="results-title">🏆 전투 결과</h2>
    <table class="results-tbl">
      <thead><tr><th>순위</th><th>캐릭터</th><th>생존</th><th>사인</th></tr></thead>
      <tbody id="results-body"></tbody>
    </table>
    <div id="results-info" class="results-info"></div>
    <div class="results-btns">
      <button class="btn primary" onclick="Lobby.rematch()">다시 하기</button>
      <button class="btn ghost"   onclick="goLobby()">로비로</button>
      <button class="btn ghost"   onclick="goMain()">메인으로</button>
    </div>
  </div>
</div>

<!-- ======= RECORDS ======= -->
<div id="s-records" class="screen">
  <div class="page-wrap">
    <div class="page-head">
      <button class="btn-back" onclick="goMain()">← 뒤로</button>
      <h2>전적</h2>
    </div>
    <div id="records-list"></div>
  </div>
</div>

</div><!-- #app -->
<script src="game.js"></script>
</body>
</html>
